name: Device compatibility report
description: Help other people choose a launcher for their TV.
labels: [compatibility]
body:
  - type: input
    id: device
    attributes:
      label: Brand and model
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Android version and QuietDeck version
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: What did you test?
      options:
        - label: App launch and layout
        - label: D-pad movement and app grid
        - label: App options / hold OK
        - label: Home button
        - label: Reboot and standby/wake
        - label: Original launcher restoration
  - type: textarea
    id: results
    attributes:
      label: Results and any Home-button workaround
      description: Report failures as well as successes. Do not include private IPs, serial numbers, account details or pairing codes.
    validations:
      required: true
